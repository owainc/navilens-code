name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # pull_request:
  #   branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - features: default
            cargo-flags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.cargo-flags }} -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.cargo-flags }}

      - name: Test
        run: cargo test --workspace ${{ matrix.cargo-flags }}

  build-executables:
    name: Build ${{ matrix.name }}
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: navilens_code
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: navilens_code.exe
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            binary: navilens_code
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release executable
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: navilens_code-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package executables
        run: |
          mkdir dist
          tag="${GITHUB_REF_NAME}"
          for p in linux macos; do
            chmod +x "artifacts/navilens_code-$p/navilens_code"
            tar -czf "dist/navilens_code-$tag-$p.tar.gz" -C "artifacts/navilens_code-$p" navilens_code
          done
          (cd artifacts/navilens_code-windows && zip -q "../../dist/navilens_code-$tag-windows.zip" navilens_code.exe)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*